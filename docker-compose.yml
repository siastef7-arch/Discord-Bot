services:
  db:
    image: postgres:17-bookworm
    environment:
      POSTGRES_USER: rift
      POSTGRES_DB: rift
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U rift -d rift']
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  bot:
    build: .
    env_file: .env
    volumes:
      - ./config:/app/config:ro
    environment:
      DATABASE_URL: postgresql://rift:${POSTGRES_PASSWORD}@db:5432/rift
    depends_on:
      db:
        condition: service_healthy
    command: ['sh', '-c', 'npm run db:migrate && node dist/index.js']
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
volumes:
  postgres_data:
